name: Build and Deploy Java Service

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
      aks_namespace:
        type: string
        required: true
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AKS_RG:
        required: true
      AKS_NAME:
        required: true
    # Uwaga: ACR dane pobierasz z repo vars (zostają po stronie caller)

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: ${{ inputs.app_name }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  SHORT_SHA: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build Maven (with tests)
        run: mvn -B -DskipTests=false verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # --- BUILD DOCKER IMAGE ON PR ---
      - name: Build Docker image for PR (no push)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build -t ${APP_NAME}:${SHORT_SHA}-pr .

      # --- PUSH WORK STARTS HERE (ONLY PUSH TO MAIN) ---
      - name: Build Docker image
        if: ${{ github.event_name == 'push' }}
        run: |
          docker build -t ${APP_NAME}:${SHORT_SHA} .

      - name: Azure Login (OIDC)
        if: ${{ github.event_name == 'push' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: ${{ github.event_name == 'push' }}
        run: az acr login --name ${ACR_NAME}

      - name: Tag images (sha + latest)
        if: ${{ github.event_name == 'push' }}
        run: |
          docker tag ${APP_NAME}:${SHORT_SHA} ${ACR_LOGIN_SERVER}/${APP_NAME}:${SHORT_SHA}
          docker tag ${APP_NAME}:${SHORT_SHA} ${ACR_LOGIN_SERVER}/${APP_NAME}:latest

      - name: Push images to ACR
        if: ${{ github.event_name == 'push' }}
        run: |
          docker push ${ACR_LOGIN_SERVER}/${APP_NAME}:${SHORT_SHA}
          docker push ${ACR_LOGIN_SERVER}/${APP_NAME}:latest

      - name: Save SHA artifact
        if: ${{ github.event_name == 'push' }}
        run: echo "${SHORT_SHA}" > image-sha.txt

      - name: Upload Image SHA Artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-sha
          path: image-sha.txt

      # --- DEPLOY TO AKS ---
      - name: AKS login
        if: ${{ github.event_name == 'push' }}
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RG }} \
            --name ${{ secrets.AKS_NAME }} \
            --overwrite-existing

      - name: Deploy to AKS via Helm
        if: ${{ github.event_name == 'push' }}
        run: |
          helm repo add funmagsoft https://funmagsoft.github.io/helm/charts
          helm repo update

          # pobierze java-service-1.0.0.tgz do ./helm/charts/
          helm dependency update ./helm

          echo "APP_NAME: ${APP_NAME}"
          echo "ACR_LOGIN_SERVER: ${ACR_LOGIN_SERVER}"
          echo "SHORT_SHA: ${SHORT_SHA}"

          helm template ${APP_NAME} ./helm \
            --namespace ${{ inputs.aks_namespace }} \
            --create-namespace \
            --set image.repository=${ACR_LOGIN_SERVER}/${APP_NAME} \
            --set image.tag=${SHORT_SHA}

          helm upgrade --install ${APP_NAME} ./helm \
            --namespace ${{ inputs.aks_namespace }} \
            --create-namespace \
            --set image.repository=${ACR_LOGIN_SERVER}/${APP_NAME} \
            --set image.tag=${SHORT_SHA}

